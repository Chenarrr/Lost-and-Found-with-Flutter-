name: CD

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Build iOS archive'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS Archive
    runs-on: macos-15
    if: ${{ inputs.build_ios && github.ref == 'refs/heads/main' }}
    environment: release
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - run: flutter pub get

      - name: Install CocoaPods
        run: pod install --project-directory=ios --deployment

      - name: Build iOS archive
        run: flutter build ipa --no-codesign --no-pub

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-${{ github.sha }}
          path: build/ios/archive/Runner.xcarchive
          retention-days: 30

name: CD

# Manual trigger only — run from the GitHub Actions tab after CI is green
on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Build iOS archive'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS Archive
    runs-on: macos-latest
    if: ${{ inputs.build_ios && github.ref == 'refs/heads/main' }}
    environment: release
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Match the exact Flutter version used in CI and local development
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios --deployment

      # Builds the Xcode archive without code signing.
      # To submit to the App Store: add your distribution certificate +
      # provisioning profile as GitHub secrets and remove --no-codesign.
      - name: Build iOS archive
        run: flutter build ipa --no-codesign

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-${{ github.sha }}
          path: build/ios/archive/Runner.xcarchive
          retention-days: 30

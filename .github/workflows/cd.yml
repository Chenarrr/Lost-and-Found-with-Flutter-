name: CD

# Manual trigger only — run from the GitHub Actions tab
on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Build iOS archive'
        type: boolean
        default: true

jobs:
  build-ios:
    name: Build iOS Archive
    runs-on: macos-latest
    if: ${{ inputs.build_ios }}

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: echo "IMGBB_API_KEY=placeholder" > .env

      # Builds the Xcode archive without code signing.
      # To submit to the App Store, add your signing certificate +
      # provisioning profile as GitHub secrets and remove --no-codesign.
      - name: Build iOS archive
        run: flutter build ipa --no-codesign

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive
          path: build/ios/archive/Runner.xcarchive
          retention-days: 30

name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'assets/**'
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'web/**'
      - 'windows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'assets/**'
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'web/**'
      - 'windows/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pin to the exact Flutter version used in local development
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/

      # Scoped to lib/ and test/ — skips generated files, Pods, build/
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ integration_test/

      - name: Analyze
        run: flutter analyze --no-pub --fatal-warnings

      - name: Test
        run: flutter test --no-pub --reporter compact --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 7

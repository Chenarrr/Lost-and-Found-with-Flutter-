name: flutter_application
description: "Find It — a lost and found community app for Kurdistan."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.0.2
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  uuid: ^4.5.3
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  share_plus: ^12.0.1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/find-it-app-icon-official.png
    - assets/find-it-symbol-transparent.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon_source.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon_source.png"
    background_color: "#1E78FF"
    theme_color: "#1E78FF"

flutter_native_splash:
  color: "#1E78FF"
  image: "assets/find-it-symbol-transparent.png"
  color_dark: "#071323"
  image_dark: "assets/find-it-symbol-transparent.png"
  android_12:
    color: "#1E78FF"
    image: "assets/find-it-symbol-transparent.png"
    color_dark: "#071323"
    image_dark: "assets/find-it-symbol-transparent.png"
  ios: true
  android: true
  web: false
